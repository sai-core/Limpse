<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphic Archive</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at top left, #0f172a, #020617);
            min-height: 100vh;
        }
        /* Custom Glass Effect Utility */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .neon-glow {
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body class="text-slate-100 p-4 font-sans antialiased relative overflow-x-hidden">

    <!-- Background Decorative Glowing Orbs -->
    <div class="fixed -top-10 -left-10 w-40 h-40 bg-sky-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed top-1/2 -right-10 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header Section -->
    <div class="flex items-center justify-between mb-5 relative z-10">
        <div>
            <h1 id="header-title" class="text-xl font-bold bg-gradient-to-r from-sky-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">
                👤 Performers
            </h1>
            <p id="header-sub" class="text-xs text-slate-400 mt-0.5">Select a performer to explore years</p>
        </div>
        <button id="back-btn" onclick="goBack()" class="hidden px-3.5 py-1.5 glass-card text-sky-400 text-xs rounded-xl font-semibold hover:bg-white/10 active:scale-95 transition">
            ← Back
        </button>
    </div>

    <!-- Search Input -->
    <div class="relative mb-5 z-10">
        <input type="text" id="search" oninput="handleSearch()" placeholder="🔍 Search library..." 
               class="w-full p-3 pl-4 rounded-xl glass-input text-sm text-white placeholder-slate-400 focus:outline-none focus:border-sky-400/60 transition">
    </div>

    <!-- Main Container -->
    <div id="content" class="space-y-3 relative z-10"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let fullData = {};
        let currentScreen = 'performers';
        let selectedPerformer = '';
        let selectedYear = '';

        // Load data.json
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                fullData = data.performers || {};
                renderPerformers();
            })
            .catch(() => {
                document.getElementById('content').innerHTML = `
                    <div class="glass-card p-6 rounded-2xl text-center text-rose-400 text-xs">
                        ⚠️ Failed to load library database.
                    </div>`;
            });

        // 1. Render Performers List
        function renderPerformers(filter = '') {
            currentScreen = 'performers';
            document.getElementById('header-title').innerText = '👤 Performers';
            document.getElementById('header-sub').innerText = 'Select a performer to explore years';
            document.getElementById('back-btn').classList.add('hidden');

            const container = document.getElementById('content');
            const perfNames = Object.keys(fullData).filter(p => p.toLowerCase().includes(filter.toLowerCase()));

            if (perfNames.length === 0) {
                container.innerHTML = `<div class="glass-card p-6 rounded-2xl text-center text-slate-400 text-xs">No performers found.</div>`;
                return;
            }

            container.innerHTML = perfNames.map(p => `
                <div onclick="selectPerformer('${p}')" 
                     class="glass-card p-4 rounded-2xl flex justify-between items-center active:scale-[0.98] transition hover:border-sky-400/40 cursor-pointer">
                    <span class="font-semibold text-sm text-sky-200 tracking-wide">👤 ${p}</span>
                    <span class="text-xs text-sky-400 font-mono bg-sky-500/10 px-2 py-1 rounded-lg border border-sky-400/20">View →</span>
                </div>
            `).join('');
        }

        // 2. Render Years Grid
        function selectPerformer(pName) {
            selectedPerformer = pName;
            currentScreen = 'years';
            document.getElementById('header-title').innerText = `📅 ${pName}`;
            document.getElementById('header-sub').innerText = 'Select a year to see scenes';
            document.getElementById('back-btn').classList.remove('hidden');
            document.getElementById('search').value = '';

            const container = document.getElementById('content');
            const years = Object.keys(fullData[pName]?.by_year || {});

            if (years.length === 0) {
                container.innerHTML = `<div class="glass-card p-6 rounded-2xl text-center text-slate-400 text-xs">No records available.</div>`;
                return;
            }

            container.innerHTML = `<div class="grid grid-cols-2 gap-3">` + years.map(y => `
                <div onclick="selectYear('${y}')" 
                     class="glass-card p-5 rounded-2xl text-center active:scale-[0.98] transition hover:border-sky-400/40 cursor-pointer">
                    <span class="font-bold text-sky-300 text-base tracking-wider">📁 ${y}</span>
                </div>
            `).join('') + `</div>`;
        }

        // 3. Render Scenes List
        function selectYear(year) {
            selectedYear = year;
            currentScreen = 'scenes';
            document.getElementById('header-title').innerText = `🎬 ${selectedPerformer} (${year})`;
            document.getElementById('header-sub').innerText = 'Tap GET to receive scene in chat';
            document.getElementById('back-btn').classList.remove('hidden');
            document.getElementById('search').value = '';

            renderScenesList();
        }

        function renderScenesList(filter = '') {
            const container = document.getElementById('content');
            const scenes = fullData[selectedPerformer]?.by_year[selectedYear] || [];
            const filtered = scenes.filter(s => (s.title || '').toLowerCase().includes(filter.toLowerCase()));

            if (filtered.length === 0) {
                container.innerHTML = `<div class="glass-card p-6 rounded-2xl text-center text-slate-400 text-xs">No scenes found.</div>`;
                return;
            }

            container.innerHTML = filtered.map((s) => `
                <div class="glass-card p-3.5 rounded-2xl flex justify-between items-center hover:border-sky-400/30 transition">
                    <div class="pr-2">
                        <div class="font-bold text-sky-200 text-sm tracking-wide">${s.title || 'Untitled'}</div>
                        <div class="text-[11px] text-slate-400 mt-1 flex items-center gap-1">
                            <span class="bg-white/5 px-2 py-0.5 rounded-md border border-white/10">🏢 ${s.distributor || s.studio || 'N/A'}</span>
                        </div>
                    </div>
                    <button onclick="deliver('${s.title}')" 
                            class="px-4 py-2 bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-400 hover:to-indigo-400 text-white rounded-xl text-xs font-bold shrink-0 neon-glow active:scale-95 transition">
                        GET 🚀
                    </button>
                </div>
            `).join('');
        }

        // Back Navigation
        function goBack() {
            if (currentScreen === 'scenes') selectPerformer(selectedPerformer);
            else if (currentScreen === 'years') renderPerformers();
        }

        // Live Search
        function handleSearch() {
            const q = document.getElementById('search').value;
            if (currentScreen === 'performers') renderPerformers(q);
            else if (currentScreen === 'scenes') renderScenesList(q);
        }

        // Send Data To Bot
        function deliver(title) {
            tg.sendData(JSON.stringify({
                action: "get_scene",
                performer: selectedPerformer,
                year: selectedYear,
                title: title
            }));
            tg.close();
        }
    </script>
</body>
</html>
